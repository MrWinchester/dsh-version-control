# dsh-version bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:~/code/dsh-web-ui/packages/dsh-version`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (version probe, npm registry poller, /api/dsh-version
# routes, the update runner), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: dsh-version
      name: '@linxin666/dsh-version'